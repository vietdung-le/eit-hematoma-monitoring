name: Repair ISAS EIT data layout (manual one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Merge DATA_PART directories and fix root license
        shell: bash
        run: |
          python3 - <<'PYREPAIR'
          #!/usr/bin/env python3
          """One-time safe repair for ISAS EIT repository browser-upload nesting.
          
          Run from repository root; uses Python 3 standard library. Verify before moves.
          Does not change any MAT/CSV bytes.
          """
          from __future__ import annotations
          import csv
          import hashlib
          from pathlib import Path
          import shutil
          import sys
          
          ROOT=Path.cwd()
          PARTS=[ROOT/f'DATA_PART_{i}' for i in (1,2,3)]
          DATA=ROOT/'data'
          MIT_TEXT='''MIT License
          
          Copyright (c) 2026 Viet-Dung Le, Huu-Loc Tran, and Trong-Tu Bui
          
          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:
          
          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.
          
          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          '''
          
          def die(msg):
              sys.exit('STOP: '+str(msg))
          
          def hashfile(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          
          def main():
              if not (ROOT/'scripts/validate_repository.py').is_file():
                  die('run from repository root (scripts/validate_repository.py not found)')
              current_license=ROOT/'LICENSE'
              if not current_license.is_file():
                  die('root LICENSE is missing; refusing to invent ownership')
              lt=current_license.read_text(encoding='utf-8')
              if 'Permission is hereby granted' in lt and 'MIT License' in lt:
                  license_mode='keep existing MIT'
              elif 'Creative Commons Attribution 4.0' in lt or 'CC-BY-4.0' in lt:
                  license_mode='replace root CC BY notice with MIT (user-selected software license)'
              else:
                  die('unrecognized root LICENSE; leave unchanged and review rights manually')
          
              found={}
              all_origins=[DATA]+[p/'data' for p in PARTS]
              for origin in all_origins:
                  if not origin.exists():
                      continue
                  for source in sorted(origin.rglob('*')):
                      if not source.is_file():
                          continue
                      logical='data/'+source.relative_to(origin).as_posix()
                      found.setdefault(logical,[]).append(source)
              manifest_files=found.get('data/FILE_MANIFEST.csv',[])
              if not manifest_files:
                  die('no data/FILE_MANIFEST.csv anywhere')
              if len({hashfile(f) for f in manifest_files})!=1:
                  die('conflicting FILE_MANIFEST.csv copies')
              with manifest_files[0].open(encoding='utf-8-sig',newline='') as f:
                  records=list(csv.DictReader(f))
              if len(records)!=212:
                  die(f'expected 212 research records, got {len(records)}')
              expected={row['relative_path']:row for row in records}
              if len(expected)!=len(records):
                  die('duplicate manifest keys')
              present=set(found)
              allowed=set(expected)|{'data/FILE_MANIFEST.csv','data/LICENSE'}
              if present!=allowed:
                  die(f'data keys mismatch, missing={sorted(allowed-present)[:10]}, extra={sorted(present-allowed)[:10]}')
              notice=found['data/LICENSE'][0].read_text(encoding='utf-8')
              if 'CC-BY-4.0' not in notice:
                  die('data/LICENSE lacks CC-BY-4.0')
              for logical, sources in found.items():
                  checks={hashfile(source) for source in sources}
                  if len(checks)!=1:
                      die(f'conflicting duplicates: {logical}')
                  if logical in expected:
                      row=expected[logical]
                      if sources[0].stat().st_size!=int(row['bytes']) or next(iter(checks))!=row['sha256']:
                          die('manifest checksum mismatch: '+logical)
              print(f'Pre-check OK: {len(expected)} research data files, {len(found)} total data files, {license_mode}')
          
              moved=0; removed_duplicates=0
              for logical,sources in sorted(found.items()):
                  destination=ROOT/logical
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  for source in sources:
                      if source==destination:
                          continue
                      if destination.exists():
                          if hashfile(source)!=hashfile(destination):
                              die('destination conflict: '+logical)
                          source.unlink()
                          removed_duplicates+=1
                      else:
                          source.rename(destination)
                          moved+=1
              for part in PARTS:
                  if part.exists():
                      if list(part.rglob('*')):
                          # Only empty directories are allowed to remain.
                          if any(p.is_file() for p in part.rglob('*')):
                              die('DATA_PART folder still contains files: '+str(part))
                      shutil.rmtree(part)
              if license_mode.startswith('replace'):
                  current_license.write_text(MIT_TEXT,encoding='utf-8',newline='\n')
              print(f'Moved {moved} files into data/, removed {removed_duplicates} duplicate copies; all bytes unchanged.')
              print('Root software license: MIT; data/LICENSE: CC BY 4.0.')
              print('Next: run python3 scripts/validate_repository.py')
          
          if __name__=='__main__':
              main()
          PYREPAIR
      - name: Verify 212 checksum-indexed files and 126 runs
        shell: bash
        run: python3 scripts/validate_repository.py
      - name: Commit repaired paths (only after validation passes)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed: repository already repaired."
          else
            git diff --cached --stat
            git commit -m "Repair research data layout and separate MIT/CC BY licenses"
            git push origin HEAD:main
          fi
